[package]
name = "forge-desktop"
version = "1.0.0"
description = "Forge desktop shell (Tauri v2 wrapping the web export)"
authors = ["Floris Voskamp"]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/Adulari/forge"

# Standalone workspace: this crate lives inside the forge monorepo (whose root
# Cargo.toml is `[workspace] members = ["crates/*"]`) but is NOT one of those
# members. Without this empty `[workspace]` table, `cargo` walks up from here,
# finds the repo-root workspace, and errors with "current package believes it's
# in a workspace when it's not". This makes src-tauri its own workspace root.
[workspace]

[lib]
name = "forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# runtime_version.rs is shared with tools/runtime-version, so build.rs hashes with the same code CI does.
sha2 = "0.10"
serde_json = "1"

[features]
# Test harnesses only (never enabled in a release build): lets FORGE_TEST_SELF_INSTALL=1 stand in
# for "running from a mounted AppImage" and FORGE_TEST_UPDATE_ENDPOINT/_PUBKEY aim the updater at
# a fake feed. Without this feature none of those variables is read.
test-self-install = []

[dependencies]
# `tray-icon` is what makes the menu-bar extra (src/tray.rs) compile; on Linux it additionally
# needs libayatana-appindicator3 (or libappindicator3) present at build time.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# The JS transport seam (mobile/src/lib/transport/index.ts) calls
# `@tauri-apps/plugin-http` and `@tauri-apps/plugin-websocket`; both need their Rust-side
# plugin registered here too, or the JS calls fail at runtime with "plugin not found".
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-websocket = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Desktop auto-detect (detect_forge_serve): resolves the same OS config dir `forge serve`
# writes serve-state.json into. Pinned to the same major version forge-config uses.
directories = "6"
# ota.rs: verify (minisign, the updater's own key), hash and unpack signed UI bundles.
minisign-verify = "0.2"
sha2 = "0.10"
base64 = "0.22"
semver = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time"] }
# onboarding.rs: unpack the release archive the installer downloads (same layout install.sh reads).
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
# detect_forge_serve's pid-liveness check (`kill(pid, 0)`).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri exposes its WebKitGTK handle so the shell can grant Forge's audio-only getUserMedia
# request. Without an embedder permission handler WebKitGTK denies microphone capture outright.
webkit2gtk = { version = "2.0", features = ["v2_8"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# ota tests sign manifests with a throwaway keypair.
minisign = "0.7"
# security_config.rs parses the HTTP scope exactly as tauri-plugin-http 2.5 does.
regex = "1"
url = "2"
urlpattern = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
