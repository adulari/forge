# XcodeGen spec (macOS): `brew install xcodegen && xcodegen generate` -> ForgeSpike.xcodeproj
name: ForgeSpike
options:
  bundleIdPrefix: dev.adulari.forge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
targets:
  ForgeSpike:
    type: application
    platform: iOS
    sources:
      - ForgeSpike
      - path: Generated
        optional: true
    dependencies:
      - framework: ForgeMobileCore.xcframework
        embed: false
    info:
      path: ForgeSpike/Info.plist
      properties:
        CFBundleDisplayName: Forge Native Spike
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adulari.forge.spike
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Generated"
        OTHER_LDFLAGS: "-lc++"
