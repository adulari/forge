[workspace]

[package]
name = "forge-gpui-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gpui-kit = { version = "=0.9.0", features = ["tree-sitter", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-bash"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
