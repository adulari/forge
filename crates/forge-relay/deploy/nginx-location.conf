# Place these locations in the TLS server for forge.adulari.dev. If Cloudflare is in front,
# configure nginx's realip module with Cloudflare's published CIDRs so $remote_addr is the real
# client; direct-origin requests then retain their actual source address.

location = /relay/health {
    proxy_pass http://127.0.0.1:8787/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location = /relay/v1/reports {
    # Issue reports (docs/features/issue-reporting): bodies are scrubbed by clients and again by
    # the relay, but never persist them in nginx logs. Requires the `forge_reports` zone from
    # nginx-reports-zone.conf (http context) to be installed first, or `nginx -t` fails.
    access_log off;
    error_log /var/log/nginx/forge-relay-error.log crit;
    limit_except POST { deny all; }
    limit_req zone=forge_reports burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8787/v1/reports;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    client_max_body_size 32k;
}

location /relay/ {
    # Older clients put the APNs token in the URL; never let it enter a log.
    access_log off;
    error_log /var/log/nginx/forge-relay-error.log crit;
    limit_except POST { deny all; }

    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    client_max_body_size 4k;
}
