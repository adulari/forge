# Install in the nginx http context (e.g. /etc/nginx/conf.d/forge-reports-zone.conf) BEFORE enabling
# the /relay/v1/reports location. 30 reports/minute/IP is far above what a healthy client sends;
# the relay applies its own per-install and global limits behind it.
limit_req_zone $binary_remote_addr zone=forge_reports:2m rate=30r/m;
