name: CI

on:
  # No `push: branches: [main]` trigger: every merge to main goes through a PR (squash-merged via
  # `gh pr merge --auto`), so `pull_request` already validated the exact same tree before merge —
  # a push-triggered rerun on the post-squash commit would just repeat that same check for free.
  pull_request:
    branches: [main]
  # Exempt from GitHub's GITHUB_TOKEN anti-recursion guard (unlike push/pull_request), so
  # release.yml can manually dispatch a real "CI" run against its bot-opened brew-formula PR
  # branch — that PR's own `pull_request` event never fires one, since it's opened with GITHUB_TOKEN.
  workflow_dispatch:
  # Weekly full verification stays on the self-hosted Arch Linux runner. Cross-platform release
  # compilation remains in the tag workflows, where those platform-native runners are required.
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    name: detect affected jobs
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      rust_fmt: ${{ steps.classify.outputs.rust_fmt }}
      rust: ${{ steps.classify.outputs.rust }}
      release_build: ${{ steps.classify.outputs.release_build }}
      anywhere_policy: ${{ steps.classify.outputs.anywhere_policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/changed-groups.sh
      - name: Test architecture size guard
        run: python3 scripts/ci/test_architecture_size.py
      - name: Enforce architecture size guard
        run: python3 scripts/ci/architecture_size.py
      - name: Test migration version guard
        run: bash scripts/ci/test-migration-version-guard.sh
      # Needs the mainline's CURRENT schema version, not the merge base: a branch that collides
      # looks correct against its own base (that is how five PRs all claimed migration 25).
      - name: Enforce migration version guard
        run: |
          git fetch --no-tags --depth=1 origin main
          MAIN_REF=FETCH_HEAD bash scripts/ci/migration-version-guard.sh
      - name: Test EAS OTA safety classifier
        run: bash scripts/ci/test-eas-ota-safety.sh
      - name: Test Android EAS build contract
        run: bash scripts/ci/test-mobile-android-workflow.sh
      - name: Test runner resource budgets
        run: bash scripts/ci/test-runner-resource-budget.sh
      - name: Test persistent runner cache bounds
        run: bash scripts/ci/test-trim-runner-cache.sh
      - name: Test standing docs freshness guard
        run: bash scripts/ci/test-docs-freshness.sh
      - name: Enforce standing docs freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check-docs-freshness.sh
      - name: Test crates.io publication order
        run: bash scripts/ci/test-crates-release-order.sh
      # Static contract between the release workflows and the published one-line installers: the
      # CLI half stays a draft, app-desktop.yml publishes it, the manifest covers every filename
      # an installer asks for, and Latest moves only after the public bytes verify (#837).
      - name: Test desktop release publication contract
        run: bash scripts/ci/test-desktop-release-publication.sh

  anywhere-policy:
    name: anywhere plaintext-canary harness
    needs: changes
    if: needs.changes.outputs.anywhere_policy == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/ci/test-anywhere-plaintext-canary.sh

  fmt:
    needs: changes
    if: needs.changes.outputs.rust_fmt == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path vendor/genai-0.6.5/Cargo.toml -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Serialize every workspace-wide Rust compile on archlinux-1. Running clippy beside the
    # test/release/Tauri builds exhausted host swap and hard-froze the workstation.
    runs-on: [self-hosted, linux, x64, heavy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy
      # No Swatinem/rust-cache here: this is a persistent self-hosted runner whose `target/`
      # already survives on local disk between jobs — restoring/saving a cache over the network
      # would be pure overhead on top of an already-warm build dir.
      # `--locked` fails if Cargo.lock is out of sync with Cargo.toml. Without it, a version bump
      # that forgets to refresh the lock (e.g. `cargo update -p forge` — a no-op, the root crate is
      # forge-cli) otherwise blows up only at release time, where the build DOES use `--locked`
      # (cost us a failed v0.4.42 release). Catch the drift on every affected Rust PR.
      - run: cargo clippy --locked --all-targets --all-features
      - run: cargo clippy --locked --manifest-path vendor/genai-0.6.5/Cargo.toml --all-targets -- -D warnings
      - name: Bound persistent build cache
        if: always()
        run: bash scripts/ci/trim-runner-cache.sh

  test:
    name: test (archlinux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # 'heavy' = archlinux-1 only: workspace-wide compiles are the box's big memory consumers —
    # serializing them on one 12G-capped runner keeps concurrent PRs from OOMing the host
    # (30G machine; three 8G runners compiling at once repeatedly killed all runner services).
    runs-on: [self-hosted, linux, x64, heavy]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - run: cargo test --locked --all --all-features
      - run: cargo test --locked --manifest-path vendor/genai-0.6.5/Cargo.toml
      - name: Bound persistent build cache
        if: always()
        run: bash scripts/ci/trim-runner-cache.sh

  # Release-profile + `--locked` smoke on one platform. The release workflow builds with
  # `--release --locked`, and breakages there (LTO-only failures, a Cargo.lock that drifted from
  # Cargo.toml) surface only at tag time otherwise — exactly what failed v0.4.42's first release.
  # Catch it on every affected Rust PR. One platform keeps it cheap; the `lto = "thin"` link runs once.
  release-build:
    needs: changes
    if: needs.changes.outputs.release_build == 'true'
    # See `test` above: heavy jobs serialize on the one heavy runner.
    runs-on: [self-hosted, linux, x64, heavy]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - run: cargo build --release --locked --bin forge
      - name: Verify upgrade, reconnect, and rollback from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-upgrade-e2e.sh "" target/release/forge
      - name: Bound persistent build cache
        if: always()
        run: bash scripts/ci/trim-runner-cache.sh

  CI:
    needs: [changes, anywhere-policy, fmt, clippy, test, release-build]
    if: always()
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Check all jobs passed
        run: |
          # Name the job AND its state. The old message said only "a required CI job failed or was
          # cancelled", which cannot tell a real failure from churn — and `cancelled` is the common
          # case here, not the rare one: 58% of heavy/release jobs end cancelled, because all three
          # workflows use ref-keyed `cancel-in-progress` and every merge to main updates every open
          # PR's branch. Dependabot #924 sat TWO WEEKS looking broken when `test` and `clippy` had
          # both passed and only `release-build` was cancelled; nobody re-ran it because the PR
          # looked failed.
          #
          # The gate is deliberately unchanged: anything that is not success|skipped still exits 1.
          # Only the diagnosis improves.
          for entry in \
            "changes=${{ needs.changes.result }}" \
            "anywhere-policy=${{ needs.anywhere-policy.result }}" \
            "fmt=${{ needs.fmt.result }}" \
            "clippy=${{ needs.clippy.result }}" \
            "test=${{ needs.test.result }}" \
            "release-build=${{ needs.release-build.result }}"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) ;;
              cancelled)
                echo "::error title=CI job cancelled, not failed::$name was CANCELLED — superseded by a newer run for this branch, not a test failure. Re-run it; nothing here says the code is broken."
                exit 1
                ;;
              *)
                echo "::error title=CI job $result::$name: $result"
                exit 1
                ;;
            esac
          done
          echo "All affected CI jobs passed"
