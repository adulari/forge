name: unstick stalled auto-merge PRs

# Auto-merge in this repo cannot advance a PR on its own once `main` moves ahead of it, and nothing
# was moving it. Two settings combine into a permanent deadlock:
#
#   ruleset "Protection branch": strict_required_status_checks_policy = true  (branch must be up to date)
#   repository:                  allow_update_branch = false                 (GitHub will not update it)
#
# The PR then sits at `mergeStateStatus: BEHIND` with every check green and auto-merge armed,
# forever, until a human runs `gh pr update-branch`. It looks healthy in every view that matters —
# green checks, auto-merge on — which is why it went unnoticed release after release.
#
# Four known incidents, one cause: #891 (v2.10.0 manifests, left Homebrew pointing at a version that
# was never published), #894 (v2.10.1 manifests, package managers stranded on 2.9.1), #897 (an
# ordinary fix PR — so this was never specific to `dist/`), and #899 (v2.10.2 manifests).
#
# `release.yml`'s manifest job already works around GitHub's OTHER anti-recursion rule — a
# GITHUB_TOKEN push creates no `pull_request` run — by dispatching the required workflows against
# the branch. That part works: the required `CI` context was verified green on the stuck SHA of
# #899. Only BEHIND was blocking it. But the same anti-recursion rule applies to the branch update
# this workflow performs, so after every update it must re-dispatch those workflows, or the new SHA
# would carry no `CI` check and the PR would merely stall for a different reason.
#
# WHEN THIS RUNS IS THE HARD PART, AND BOTH ORIGINAL TRIGGERS WERE MEASURED TO BE UNRELIABLE.
#
# The remediation below is proven — it recovered a live BEHIND PR (#916, v2.11.0's manifests) on
# demand. What failed was reaching it in time, because the two triggers it originally had are both
# weaker than they read:
#
#  · push to main is DROPPED, and not occasionally. On 2026-07-27 #917 (08:43), #918 (09:16) and
#    #919 (13:19) all merged to main and NONE produced a push-event run here — the last one was #915
#    at 00:02. Three consecutive misses. This is the same loss that left #890 and #910 with no
#    eas-update run at all, so it is not specific to one workflow.
#  · the schedule is DEPRIORITISED. The cron below asks for every 30 minutes; the runs actually
#    delivered that day were 23:31, 03:43, 07:39 and 11:31 — roughly every four hours. GitHub drops
#    scheduled runs on busy repositories.
#
# Between them, #916 spent thirteen hours unmergeable with every check on it green, because each
# time main advanced it fell BEHIND again and nothing arrived to notice.
#
# So the real trigger is `workflow_run`: reconcile every time one of the workflows that run
# constantly finishes, on any branch. That is frequent, driven by activity rather than by a clock,
# and — unlike the push event — keyed on a run this repository can see completing. It also fires at
# exactly the moment a manifests PR needs it, since `release`/`app-desktop` complete just as that PR
# is opened. push and schedule stay as extra chances, not as the mechanism.
#
# This converges rather than looping: an update dispatches CI, CI's completion re-triggers this, and
# by then the PR is no longer BEHIND, so nothing further is dispatched.

on:
  workflow_run:
    workflows: [CI, security, mobile-typecheck, release, app-desktop]
    types: [completed]
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # re-dispatches the required workflows after updating a branch

# One at a time: two concurrent runs would both try to update the same branch, and the loser's
# update lands on a SHA whose dispatched checks were already superseded.
concurrency:
  group: unstick-automerge
  cancel-in-progress: false

jobs:
  unstick:
    name: update branches auto-merge cannot advance
    # GitHub-hosted on purpose: this is a handful of API calls on a 30-minute schedule, and the
    # self-hosted runners are a real machine that should not be woken up for it.
    runs-on: ubuntu-latest
    # 10 was sized for a handful of PRs and killed every run once the queue reached 15. The cap
    # below bounds the work; this bounds the blast radius if an individual API call wedges.
    timeout-minutes: 20
    steps:
      # THE `push` TRIGGER FIRES TOO EARLY TO BE USEFUL, AND THAT COSTS ~AN HOUR PER MERGE.
      #
      # A merge to main fires this workflow within seconds — measured at **3s** after #1009
      # (merged 00:18:04, sweep 00:18:07) and **6s** after #1011 (01:42:03 / 01:42:09). GitHub has
      # not yet recomputed the other open PRs' mergeable state by then, so the sweep sees nothing
      # BEHIND, updates nothing, and exits successfully having done no work.
      #
      # The open set then waits for the next `schedule`, which in practice runs closer to hourly
      # than the declared */30 (observed firings 56 minutes apart, with several slots missed
      # entirely — GitHub delays or drops scheduled workflows under load). Both merges tonight left
      # eight PRs sitting BEHIND for 12+ minutes with a push sweep already run and wasted.
      #
      # Pausing briefly on this trigger alone is enough for the states to settle. 60s is a
      # heuristic, not a measured floor — the `schedule` and `workflow_run` triggers remain the
      # backstops if it is ever too short, exactly as they are today. The wait costs a
      # GitHub-hosted runner a minute and never touches the self-hosted bottleneck.
      - name: Let GitHub settle mergeable state after a merge to main
        if: github.event_name == 'push'
        run: sleep 60

      # THE STALL THIS WORKFLOW CAUSED ITSELF.
      #
      # `gh pr update-branch` below writes a merge commit authored by `github-actions[bot]`, and this
      # repository's fork-PR policy is `all_external_contributors`, which counts that bot as external.
      # So every branch update parks its own PR's `pull_request` checks in "3 workflows awaiting
      # approval", and the required `CI` context never arrives — the fix creating the next stall.
      # #912, #916 and #920 each hit it, and the dispatched runs below exist only to work around it.
      #
      # THE POLICY MUST NOT BE LOOSENED TO FIX THIS. This repository is public and every CI job runs
      # on self-hosted runners on a personal machine, so `all_external_contributors` is the only thing
      # between a stranger's fork PR and arbitrary code execution there. Relaxing it to stop the
      # prompts would trade a merge annoyance for remote code execution.
      #
      # Approving is safe for exactly one case, which is the case that actually occurs: a run whose
      # HEAD REPOSITORY IS THIS ONE. A branch here can only be pushed by someone with write access, so
      # it carries no untrusted code, and the approval prompt protects nothing. A run from a fork is
      # deliberately left alone for a human — that is what the policy is for.
      - name: Approve runs GitHub parked for approval that carry no external code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          runs=$(gh api "repos/$GH_REPO/actions/runs?status=action_required&per_page=50" \
            --jq '.workflow_runs[] | select(.head_repository.full_name == env.GH_REPO) | .id')

          if [ -z "$runs" ]; then
            echo "no run from this repository is waiting for approval"
            exit 0
          fi

          for run in $runs; do
            if gh api -X POST "repos/$GH_REPO/actions/runs/$run/approve" >/dev/null; then
              echo "approved run $run — its head is this repository, so it runs no external code"
            else
              echo "::warning title=Could not approve a parked run::run $run is waiting for approval and could not be approved automatically; a maintainer has to press the button."
            fi
          done

      - name: Update every stalled auto-merge PR and re-arm its checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # mergeStateStatus is only computed on demand, so a freshly-pushed main can leave it
          # UNKNOWN for a few seconds. Asking for it per-PR below (rather than in this list query)
          # gives GitHub time to settle and avoids acting on a stale value.
          numbers=$(gh pr list --state open --limit 50 \
            --json number,isDraft,autoMergeRequest \
            --jq '.[] | select(.isDraft == false) | select(.autoMergeRequest != null) | .number')

          if [ -z "$numbers" ]; then
            echo "no open PR has auto-merge armed — nothing to unstick"
            exit 0
          fi

          # A PR armed this long that still has not merged is not waiting for CI; it is stuck on
          # something this workflow cannot fix. Saying so is the point — every incident above was
          # invisible precisely because the PR looked healthy while nothing moved it. Roughly three
          # times the slowest pipeline, so an ordinary release does not trip it.
          STALE_AFTER_SECONDS=7200

          # Branch updates per run. Each one costs an update-branch plus three workflow dispatches,
          # and every run has to finish inside the job timeout — with a large queue an unbounded
          # loop is killed mid-flight and unsticks NOTHING (observed 2026-08-06: five consecutive
          # runs cancelled at the 10-minute cap while 15 PRs were armed). The remainder is reported,
          # never silently dropped, and the next scheduled run continues from where this one stopped.
          MAX_UPDATES_PER_RUN=6
          updates_done=0

          # Same bounding for the missing-context dispatches below, and the same reporting rule:
          # whatever this run does not reach is named, not dropped.
          MAX_DISPATCHES_PER_RUN=4
          dispatches_done=0

          # How long a head SHA may carry no required context before that counts as a dropped event
          # rather than checks that simply have not registered yet. A real `pull_request` run
          # appears within seconds; ten minutes is far outside that and well inside the window where
          # a PR still looks merely "queued" to a human.
          CHECKS_MISSING_AFTER_SECONDS=600

          # How long to wait, after updating a branch, for GitHub to register the runs it creates
          # for the new head — before concluding it created none and dispatching replacements.
          # Polled rather than slept in one block: the registration delay is variable, so a single
          # fixed wait is either too short (and manufactures duplicate heavy jobs) or a tax paid on
          # every update. 6 × 10s triples the old 20s ceiling while making the common case cheaper.
          POST_UPDATE_SETTLE_ATTEMPTS=6
          POST_UPDATE_SETTLE_INTERVAL_SECONDS=10

          for pr in $numbers; do
            # The per-PR call exists because mergeStateStatus is computed on demand. It used to say
            # one view settles it "just as well as two" — MEASURED FALSE. On the first sweep after
            # #1020 merged, ten of twelve PRs came back `UNKNOWN` on that single view and were
            # skipped by the `!= "BEHIND"` branch below, so the sweep re-armed exactly one of them.
            # The whole set then waited for later triggers, which is the stall this workflow exists
            # to prevent.
            #
            # A query STARTS GitHub's computation; it does not wait for it. So ask again. The first
            # view is the trigger, a later one collects the answer. Bounded at 4 retries x 5s per
            # PR — in practice the first PR's wait warms the rest, and the job's 20-minute timeout
            # absorbs the worst case comfortably (observed sweeps take 2-3 minutes).
            view_pr() {
              read -r state branch armed_at < <(gh pr view "$1" \
                --json mergeStateStatus,headRefName,autoMergeRequest \
                --jq '"\(.mergeStateStatus) \(.headRefName) \(.autoMergeRequest.enabledAt // "")"')
            }
            view_pr "$pr"
            unknown_retries=0
            while [ "$state" = "UNKNOWN" ] && [ "$unknown_retries" -lt 4 ]; do
              sleep 5
              unknown_retries=$(( unknown_retries + 1 ))
              view_pr "$pr"
            done
            if [ "$state" = "UNKNOWN" ]; then
              echo "#$pr: mergeStateStatus still UNKNOWN after $unknown_retries retries — leaving for the next sweep"
            fi
            if [ -n "$armed_at" ] && [ "$state" != "CLEAN" ] && [ "$state" != "HAS_HOOKS" ]; then
              armed_for=$(( $(date -u +%s) - $(date -u -d "$armed_at" +%s) ))
              if [ "$armed_for" -gt "$STALE_AFTER_SECONDS" ]; then
                echo "::warning title=Auto-merge has not advanced::#$pr has had auto-merge armed for $(( armed_for / 3600 ))h and is still $state. If this survives a branch update, it needs a human."
              fi
            fi

            if [ "$state" != "BEHIND" ]; then
              # A HEAD SHA CARRYING NO REQUIRED CONTEXT AT ALL IS THE INVISIBLE STALL.
              #
              # Originally this covered only `dist/*`: those branches are bot-authored, GitHub
              # creates no `pull_request` runs for them, and release.yml's dispatch is the only
              # thing that can produce their `CI` context. But the same end state reaches ordinary
              # branches whenever GitHub simply drops the event. Measured 2026-08-06: after
              # `gh pr update-branch` on eight PRs (owner token, so not the bot-parking case),
              # GitHub created ZERO runs for those heads — statusCheckRollup empty, so the required
              # contexts were not failing or pending, they did not exist, and every one of those
              # PRs would have waited forever for something that was never coming. It is invisible
              # precisely because "no checks" and "checks still queued" look identical everywhere.
              #
              # So the check is now about the CONDITION, not the branch name: no required context
              # present on a head that has had time to produce one. The age floor keeps this from
              # racing a genuinely fresh push, whose runs appear seconds later.
              if [ "$state" = "BLOCKED" ]; then
                head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
                contexts=$(gh api "repos/$GH_REPO/commits/$head/check-runs" \
                  --jq '[.check_runs[] | select(.name == "CI" or .name == "mobile checks" or .name == "security checks")] | length')
                pushed_at=$(gh api "repos/$GH_REPO/commits/$head" --jq '.commit.committer.date')
                head_age=$(( $(date -u +%s) - $(date -u -d "$pushed_at" +%s) ))
                # THE CONTEXT COUNT ABOVE IS NOT ENOUGH ON ITS OWN: it looks for the AGGREGATE names
                # (`CI`, `mobile checks`, `security checks`), and those check runs do not exist until
                # the gating job that fans out to them has finished. A `pull_request` run sitting in
                # the queue therefore looks exactly like "GitHub created no run at all", and this
                # branch dispatches a second, redundant copy of all three workflows.
                #
                # That is not hypothetical. Measured 2026-08-10: 12 of 49 queued runs — 24% of the
                # whole queue — were duplicate pairs on the SAME head SHA, one `pull_request` and one
                # `workflow_dispatch`, across 8 PRs. Every heavy job in those 12 runs competes for
                # archlinux-1, which is the only runner carrying the `heavy` and `release` labels, so
                # the waste lands squarely on the one serialized resource.
                #
                # So also ask whether any run for this SHA is still live. Runs parked at
                # `action_required` — the bot-merge-commit case this guard exists for — report
                # `status=completed`, so they are correctly NOT counted here and dispatch still
                # happens for them. Only a genuinely queued or running workflow suppresses it.
                live_runs=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$head&per_page=100" \
                  --jq '[.workflow_runs[] | select(.status != "completed")] | length')

                # A REQUIRED CONTEXT CAN BE PRESENT AND STILL NEVER SETTLE, WHICH THIS JOB CANNOT
                # CURRENTLY RESCUE. The dispatch below keys on `contexts == 0` — a MISSING context.
                # A context that exists but hangs forever is not missing, so it slips through and the
                # PR waits indefinitely with nothing red.
                #
                # Measured 2026-08-11 on #1028: the `mobile checks` aggregate declares
                # `timeout-minutes: 5` and sat `in_progress` for 23 minutes. GitHub enforces a job
                # timeout via the runner reporting back, so a runner that disappears mid-job leaves
                # the record live forever. It took a hand-run `gh workflow run` to clear.
                #
                # DETECTION ONLY, DELIBERATELY — this warns and does not dispatch. The discriminator
                # is `run completed AND job not completed`, which cannot match a healthy job (a live
                # job's run is live too). But these orphans appeared during an active GitHub incident
                # ("Incident with GraphQL API Requests", 2026-08-11 14:50Z), and a false positive
                # here spends a full set of heavy jobs on archlinux-1 — the exact waste the guard
                # above exists to prevent. Warning first makes the failure visible the moment it
                # happens instead of requiring archaeology, at zero risk to the bottleneck. Turning
                # this into a dispatch is a deliberate follow-up, to be validated against a healthy
                # API and against a genuinely long-running `test`/`release-build` job first.
                #
                # An elapsed-time rule would NOT be a safe substitute: `test` and `release-build`
                # declare `timeout-minutes: 90` and legitimately run for tens of minutes, so any
                # threshold short enough to catch a dead 5-minute aggregate would re-dispatch healthy
                # heavy jobs.
                for stuck in $(gh api "repos/$GH_REPO/actions/runs?head_sha=$head&per_page=100" \
                  --jq '.workflow_runs[] | select(.status == "completed") | .id' 2>/dev/null); do
                  orphans=$(gh api "repos/$GH_REPO/actions/runs/$stuck/jobs" \
                    --jq '[.jobs[] | select(.status != "completed") | .name] | join(", ")' 2>/dev/null || echo "")
                  if [ -n "$orphans" ]; then
                    echo "::warning title=Orphaned check job::#$pr run $stuck completed while job(s) [$orphans] are still in_progress on $head. A required context in that state never settles and will block this PR indefinitely — re-dispatch that workflow at the branch. See docs/ci/reading-ci-state.md trap 5."
                  fi
                done

                if [ "$live_runs" -gt 0 ]; then
                  echo "#$pr: $live_runs run(s) already queued or in progress on $head — not dispatching a duplicate"
                  continue
                fi
                if [ "$contexts" -eq 0 ] && [ "$head_age" -gt "$CHECKS_MISSING_AFTER_SECONDS" ]; then
                  if [ "$dispatches_done" -ge "$MAX_DISPATCHES_PER_RUN" ]; then
                    echo "#$pr: no required context on $head — deferred to the next run (this run already dispatched for $MAX_DISPATCHES_PER_RUN PRs)"
                    continue
                  fi
                  echo "::warning title=Required checks never arrived::#$pr has no CI/mobile/security context on $head after $(( head_age / 60 ))m — GitHub created no run for it. Dispatching the required workflows."
                  for workflow in ci.yml security.yml mobile-typecheck.yml; do
                    gh workflow run "$workflow" --ref "$branch" \
                      || echo "::warning title=Check dispatch failed::could not dispatch $workflow for #$pr ($branch)"
                  done
                  dispatches_done=$(( dispatches_done + 1 ))
                  continue
                fi
              fi
              echo "#$pr: $state — leaving alone"
              continue
            fi

            if [ "$updates_done" -ge "$MAX_UPDATES_PER_RUN" ]; then
              echo "#$pr: BEHIND — deferred to the next run (this run already updated $MAX_UPDATES_PER_RUN branches)"
              continue
            fi

            echo "#$pr: BEHIND — auto-merge cannot advance it, updating the branch"
            if ! gh pr update-branch "$pr"; then
              # A genuine conflict with main needs a human; say so rather than retrying every
              # 30 minutes in silence.
              echo "::warning title=Stalled PR needs a human::#$pr is BEHIND and could not be updated automatically (likely a conflict with main)."
              continue
            fi

            # The update above is pushed with GITHUB_TOKEN, which is SUPPOSED to create no
            # `pull_request` runs for the new head SHA — hence these dispatches, without which the
            # required `CI` context would never appear and the PR would stall one state later.
            #
            # THAT PREMISE DOES NOT ALWAYS HOLD, and when it does not this loop manufactures a
            # duplicate every single time it updates a branch. Measured 2026-08-10, right after a
            # merge to main made every open PR BEHIND: six branches each ended up with a
            # `workflow_dispatch` CI run AND a `pull_request` CI run on the same head SHA, the
            # dispatch created ~3 seconds BEFORE the pull_request run —
            #     17:38:06 workflow_dispatch  fix/usage-model-attribution 6c6117aa
            #     17:38:09 pull_request       fix/usage-model-attribution 6c6117aa
            # Every duplicate costs a full set of heavy jobs on archlinux-1, the only runner
            # carrying the `heavy`/`release` labels, which is already the sole bottleneck.
            #
            # So look before dispatching, on the NEW head SHA.
            #
            # A FIXED WAIT IS THE WRONG SHAPE FOR THIS, and 20 seconds was measured to be too short.
            # On 2026-08-11 #1026 was updated and GitHub created its `pull_request` runs at 14:19:20;
            # this loop dispatched three duplicates at 14:19:36-40, sixteen seconds later. The
            # duplicates were still queued on archlinux-1 twenty minutes after the PR had merged —
            # heavy jobs burnt on a dead branch while fourteen other PRs waited behind them.
            #
            # The delay before GitHub registers a run is variable, so any single sleep is either a
            # guess that is too short (duplicates) or a tax paid on every branch update. Poll
            # instead: give it up to POST_UPDATE_SETTLE_ATTEMPTS chances, stop the moment a run
            # appears. The common case now costs one interval rather than a flat 20s, and the slow
            # case gets three times the old budget before concluding nothing is coming.
            #
            # Fails OPEN: if the head SHA or every run query is unavailable, dispatch exactly as
            # before. And if GitHub is slower than the whole poll, the missing-context branch earlier
            # in this job still dispatches once the head is older than CHECKS_MISSING_AFTER_SECONDS,
            # so a genuinely run-less head is still rescued — one cycle later rather than never.
            new_head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid 2>/dev/null || echo "")
            live_after_update=0
            if [ -n "$new_head" ]; then
              settle_attempt=0
              while [ "$settle_attempt" -lt "$POST_UPDATE_SETTLE_ATTEMPTS" ]; do
                sleep "$POST_UPDATE_SETTLE_INTERVAL_SECONDS"
                settle_attempt=$(( settle_attempt + 1 ))
                live_after_update=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$new_head&per_page=100" \
                  --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
                if [ "$live_after_update" -gt 0 ]; then
                  echo "#$pr: GitHub's runs for $new_head appeared after ${settle_attempt} poll(s)"
                  break
                fi
              done
            fi
            if [ "$live_after_update" -gt 0 ]; then
              echo "#$pr: branch updated; GitHub created $live_after_update run(s) for $new_head — not dispatching duplicates"
            else
              for workflow in ci.yml security.yml mobile-typecheck.yml; do
                gh workflow run "$workflow" --ref "$branch" \
                  || echo "::warning title=Check dispatch failed::could not dispatch $workflow for #$pr ($branch)"
              done
            fi
            updates_done=$(( updates_done + 1 ))
            # Deliberately not claiming "re-dispatched" here any more: the branch above decides
            # whether that happened, and a log line asserting it unconditionally is how the
            # duplicate dispatching stayed invisible in the first place.
            echo "#$pr: branch updated"
          done
