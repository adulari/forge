name: unstick stalled auto-merge PRs

# Auto-merge in this repo cannot advance a PR on its own once `main` moves ahead of it, and nothing
# was moving it. Two settings combine into a permanent deadlock:
#
#   ruleset "Protection branch": strict_required_status_checks_policy = true  (branch must be up to date)
#   repository:                  allow_update_branch = false                 (GitHub will not update it)
#
# The PR then sits at `mergeStateStatus: BEHIND` with every check green and auto-merge armed,
# forever, until a human runs `gh pr update-branch`. It looks healthy in every view that matters —
# green checks, auto-merge on — which is why it went unnoticed release after release.
#
# Four known incidents, one cause: #891 (v2.10.0 manifests, left Homebrew pointing at a version that
# was never published), #894 (v2.10.1 manifests, package managers stranded on 2.9.1), #897 (an
# ordinary fix PR — so this was never specific to `dist/`), and #899 (v2.10.2 manifests).
#
# `release.yml`'s manifest job already works around GitHub's OTHER anti-recursion rule — a
# GITHUB_TOKEN push creates no `pull_request` run — by dispatching the required workflows against
# the branch. That part works: the required `CI` context was verified green on the stuck SHA of
# #899. Only BEHIND was blocking it. But the same anti-recursion rule applies to the branch update
# this workflow performs, so after every update it must re-dispatch those workflows, or the new SHA
# would carry no `CI` check and the PR would merely stall for a different reason.
#
# WHEN THIS RUNS IS THE HARD PART, AND BOTH ORIGINAL TRIGGERS WERE MEASURED TO BE UNRELIABLE.
#
# The remediation below is proven — it recovered a live BEHIND PR (#916, v2.11.0's manifests) on
# demand. What failed was reaching it in time, because the two triggers it originally had are both
# weaker than they read:
#
#  · push to main is DROPPED, and not occasionally. On 2026-07-27 #917 (08:43), #918 (09:16) and
#    #919 (13:19) all merged to main and NONE produced a push-event run here — the last one was #915
#    at 00:02. Three consecutive misses. This is the same loss that left #890 and #910 with no
#    eas-update run at all, so it is not specific to one workflow.
#  · the schedule is DEPRIORITISED. The cron below asks for every 30 minutes; the runs actually
#    delivered that day were 23:31, 03:43, 07:39 and 11:31 — roughly every four hours. GitHub drops
#    scheduled runs on busy repositories.
#
# Between them, #916 spent thirteen hours unmergeable with every check on it green, because each
# time main advanced it fell BEHIND again and nothing arrived to notice.
#
# So the real trigger is `workflow_run`: reconcile every time one of the workflows that run
# constantly finishes, on any branch. That is frequent, driven by activity rather than by a clock,
# and — unlike the push event — keyed on a run this repository can see completing. It also fires at
# exactly the moment a manifests PR needs it, since `release`/`app-desktop` complete just as that PR
# is opened. push and schedule stay as extra chances, not as the mechanism.
#
# This converges rather than looping: an update dispatches CI, CI's completion re-triggers this, and
# by then the PR is no longer BEHIND, so nothing further is dispatched.

on:
  workflow_run:
    workflows: [CI, security, mobile-typecheck, release, app-desktop]
    types: [completed]
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # re-dispatches the required workflows after updating a branch

# One at a time: two concurrent runs would both try to update the same branch, and the loser's
# update lands on a SHA whose dispatched checks were already superseded.
concurrency:
  group: unstick-automerge
  cancel-in-progress: false

jobs:
  unstick:
    name: update branches auto-merge cannot advance
    # GitHub-hosted on purpose: this is a handful of API calls on a 30-minute schedule, and the
    # self-hosted runners are a real machine that should not be woken up for it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # THE STALL THIS WORKFLOW CAUSED ITSELF.
      #
      # `gh pr update-branch` below writes a merge commit authored by `github-actions[bot]`, and this
      # repository's fork-PR policy is `all_external_contributors`, which counts that bot as external.
      # So every branch update parks its own PR's `pull_request` checks in "3 workflows awaiting
      # approval", and the required `CI` context never arrives — the fix creating the next stall.
      # #912, #916 and #920 each hit it, and the dispatched runs below exist only to work around it.
      #
      # THE POLICY MUST NOT BE LOOSENED TO FIX THIS. This repository is public and every CI job runs
      # on self-hosted runners on a personal machine, so `all_external_contributors` is the only thing
      # between a stranger's fork PR and arbitrary code execution there. Relaxing it to stop the
      # prompts would trade a merge annoyance for remote code execution.
      #
      # Approving is safe for exactly one case, which is the case that actually occurs: a run whose
      # HEAD REPOSITORY IS THIS ONE. A branch here can only be pushed by someone with write access, so
      # it carries no untrusted code, and the approval prompt protects nothing. A run from a fork is
      # deliberately left alone for a human — that is what the policy is for.
      - name: Approve runs GitHub parked for approval that carry no external code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          runs=$(gh api "repos/$GH_REPO/actions/runs?status=action_required&per_page=50" \
            --jq '.workflow_runs[] | select(.head_repository.full_name == env.GH_REPO) | .id')

          if [ -z "$runs" ]; then
            echo "no run from this repository is waiting for approval"
            exit 0
          fi

          for run in $runs; do
            if gh api -X POST "repos/$GH_REPO/actions/runs/$run/approve" >/dev/null; then
              echo "approved run $run — its head is this repository, so it runs no external code"
            else
              echo "::warning title=Could not approve a parked run::run $run is waiting for approval and could not be approved automatically; a maintainer has to press the button."
            fi
          done

      - name: Update every stalled auto-merge PR and re-arm its checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # mergeStateStatus is only computed on demand, so a freshly-pushed main can leave it
          # UNKNOWN for a few seconds. Asking for it per-PR below (rather than in this list query)
          # gives GitHub time to settle and avoids acting on a stale value.
          numbers=$(gh pr list --state open --limit 50 \
            --json number,isDraft,autoMergeRequest \
            --jq '.[] | select(.isDraft == false) | select(.autoMergeRequest != null) | .number')

          if [ -z "$numbers" ]; then
            echo "no open PR has auto-merge armed — nothing to unstick"
            exit 0
          fi

          # A PR armed this long that still has not merged is not waiting for CI; it is stuck on
          # something this workflow cannot fix. Saying so is the point — every incident above was
          # invisible precisely because the PR looked healthy while nothing moved it. Roughly three
          # times the slowest pipeline, so an ordinary release does not trip it.
          STALE_AFTER_SECONDS=7200

          for pr in $numbers; do
            read -r state branch < <(gh pr view "$pr" \
              --json mergeStateStatus,headRefName --jq '"\(.mergeStateStatus) \(.headRefName)"')

            armed_at=$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // empty')
            if [ -n "$armed_at" ] && [ "$state" != "CLEAN" ] && [ "$state" != "HAS_HOOKS" ]; then
              armed_for=$(( $(date -u +%s) - $(date -u -d "$armed_at" +%s) ))
              if [ "$armed_for" -gt "$STALE_AFTER_SECONDS" ]; then
                echo "::warning title=Auto-merge has not advanced::#$pr has had auto-merge armed for $(( armed_for / 3600 ))h and is still $state. If this survives a branch update, it needs a human."
              fi
            fi

            if [ "$state" != "BEHIND" ]; then
              # A `dist/` branch is bot-authored, so GitHub creates no `pull_request` runs for it and
              # release.yml's dispatch is the ONLY thing that can ever produce its required `CI`
              # context. If that dispatch failed at release time, the PR is unmergeable forever with
              # no other mechanism to notice. Human PRs need no equivalent — their checks arrive on
              # the `pull_request` event — so this stays narrowly scoped rather than racing real CI.
              if [ "$state" = "BLOCKED" ] && case "$branch" in dist/*) true ;; *) false ;; esac; then
                head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
                if [ -z "$(gh api "repos/$GH_REPO/commits/$head/check-runs" \
                     --jq '.check_runs[] | select(.name == "CI") | .name')" ]; then
                  echo "#$pr: BLOCKED with no CI check on $head — dispatching the required workflows"
                  for workflow in ci.yml security.yml mobile-typecheck.yml; do
                    gh workflow run "$workflow" --ref "$branch" \
                      || echo "::warning title=Check dispatch failed::could not dispatch $workflow for #$pr ($branch)"
                  done
                  continue
                fi
              fi
              echo "#$pr: $state — leaving alone"
              continue
            fi

            echo "#$pr: BEHIND — auto-merge cannot advance it, updating the branch"
            if ! gh pr update-branch "$pr"; then
              # A genuine conflict with main needs a human; say so rather than retrying every
              # 30 minutes in silence.
              echo "::warning title=Stalled PR needs a human::#$pr is BEHIND and could not be updated automatically (likely a conflict with main)."
              continue
            fi

            # The update above was pushed with GITHUB_TOKEN, so GitHub creates no `pull_request`
            # runs for the new head SHA. Without these dispatches the required `CI` context would
            # never appear on it and the PR would stall again, one state later.
            for workflow in ci.yml security.yml mobile-typecheck.yml; do
              gh workflow run "$workflow" --ref "$branch" \
                || echo "::warning title=Check dispatch failed::could not dispatch $workflow for #$pr ($branch)"
            done
            echo "#$pr: branch updated and required checks re-dispatched"
          done
