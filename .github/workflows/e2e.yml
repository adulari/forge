name: e2e

# Real-turn cross-platform E2E. Runs the headless `forge run` against a real provider on
# Windows + Arch Linux + macOS so cross-platform behaviour (bridge launch, PATH, clipboard, keyring,
# routing) is exercised on a REAL Windows box — which we can't run locally without a VM. Also runs
# the probing `forge doctor` on each OS and uploads its output, so a maintainer with no Windows
# machine can diagnose breakage from the logs.
#
# Manual (Actions tab → e2e → Run workflow), or weekly. The scheduled gate uses the repository's
# dedicated Groq smoke credential. A manual run can select GitHub Models, which authenticates with
# the workflow's short-lived GITHUB_TOKEN (`models: read` only).

on:
  workflow_dispatch:
    inputs:
      model:
        description: Real provider model to exercise
        required: false
        default: groq::llama-3.3-70b-versatile
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — catch cross-platform drift weekly

permissions:
  contents: read
  models: read

jobs:
  realturn:
    name: real turn (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # `label` stays a plain string for the artifact/log names below; `runner` is what
        # actually goes to runs-on and differs for the Arch leg (self-hosted array vs
        # hosted string) — macOS/Windows stay on their GitHub-hosted runners.
        include:
          - label: archlinux
            runner: [release, linux, x64]
          - label: windows-latest
            runner: windows-latest
          - label: macos-latest
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash # bash is present on the Windows runner too — one script for all OSes
    env:
      # The 70B model has enough TPM for Forge's full system prompt; the old 8B smoke model did not.
      E2E_MODEL: ${{ inputs.model || 'groq::llama-3.3-70b-versatile' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      # Ephemeral GitHub-hosted legs have no warm target/ dir, so the cache earns its keep.
      # The self-hosted Arch leg skips it: target/ already persists on that box's local disk
      # between runs, so a network cache round-trip would be pure overhead on top of that.
      - if: matrix.label != 'archlinux'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Build forge
        run: cargo build --release --locked --bin forge

      - name: Validate provider configuration
        run: |
          case "$E2E_MODEL" in
            groq::*)
              test -n "$GROQ_API_KEY" || {
                echo "::error::GROQ_API_KEY is required for $E2E_MODEL"
                exit 1
              }
              ;;
            github_copilot::*)
              test -n "$GITHUB_TOKEN" || {
                echo "::error::GITHUB_TOKEN is required for $E2E_MODEL"
                exit 1
              }
              ;;
            *)
              echo "::error::unsupported E2E provider in model: $E2E_MODEL"
              exit 1
              ;;
          esac

      - name: doctor (diagnostics)
        run: |
          set +e
          cargo run --release --locked -q --bin forge -- doctor 2>&1 | tee doctor-${{ matrix.label }}.txt
          doctor_rc=${PIPESTATUS[0]}
          set -e

          report="doctor-${{ matrix.label }}.txt"
          {
            echo "### forge doctor (${{ matrix.label }})"
            echo "- command exit: ${doctor_rc}"
            echo "- provider probe failures are informational here; the selected provider is gated by the real-turn step"
            echo '```text'
            sed -n '/^[[:space:]]*[✗⚠]/p; /^✗ No usable model provider/p' "$report" | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # `doctor` checks every configured provider. An unused provider timing out is useful
          # evidence but must not hide a cross-platform host regression; the real-turn step
          # separately gates the provider selected for this E2E run. All other hard failures,
          # including a missing usable provider or a malformed/incomplete report, remain required.
          hard_failures=$(awk '
            /^(Config|Providers|Bridge liveness|Background daemon|Local LLM \(Ollama\)|Environment)$/ { section = $0 }
            /^[[:space:]]*✗/ && section != "Providers" { print }
            /^✗ No usable model provider/ { print }
          ' "$report")
          if ! grep -qE '[0-9]+ failure\(s\), [0-9]+ warning\(s\)\.' "$report"; then
            echo "::error::forge doctor produced no complete diagnostic summary on ${{ matrix.label }}"
            exit 1
          fi
          if [ -n "$hard_failures" ]; then
            echo "::error::forge doctor found a hard diagnostic regression on ${{ matrix.label }}"
            printf '%s\n' "$hard_failures"
            exit 1
          fi

      - name: real turn
        run: |
          set -o pipefail
          echo "model: $E2E_MODEL"
          cargo run --release --locked -q --bin forge -- run \
            "Reply with exactly the single word: PONG" --model "$E2E_MODEL" \
            2>&1 | tee turn-${{ matrix.label }}.txt
          # Fail on the cross-platform failure signatures we care about.
          if grep -qiE "panic|Resolver error|No usable model|provider auth failed|RUST_BACKTRACE|UNIQUE constraint failed: lattice_node.id" turn-${{ matrix.label }}.txt; then
            echo "::error::real turn produced an error marker on ${{ matrix.label }}"
            exit 1
          fi
          # Strip terminal colour/progress control sequences, then require the exact requested
          # answer on its own line. A merely non-empty log is not a successful model turn.
          perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g; s/\r/\n/g' \
            turn-${{ matrix.label }}.txt > turn-plain-${{ matrix.label }}.txt
          # Forge's in-place progress spinner may share the final rendered line with the answer.
          # Accept only a bare PONG or that exact answer immediately after the known spinner.
          if ! grep -Eq '^(PONG|.*working…[[:space:]]*[0-9]+sPONG)$' turn-plain-${{ matrix.label }}.txt; then
            echo "::error::real turn did not return exact PONG on ${{ matrix.label }}"
            exit 1
          fi

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-${{ matrix.label }}
          path: |
            doctor-${{ matrix.label }}.txt
            turn-${{ matrix.label }}.txt
          if-no-files-found: ignore
      - name: Bound persistent build cache
        if: always() && matrix.label == 'archlinux'
        run: bash scripts/ci/trim-runner-cache.sh
