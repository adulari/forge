name: eas-update

# Publishes an EAS Update (OTA) to the `production` channel on every push to main that
# touches OTA-safe JS or assets. Ships JS + assets only — no native code, no new
# binary. The installed app checks for + applies the update on launch and foreground
# (mobile/src/lib/useOtaUpdates.ts), gated by a runtimeVersion fingerprint so an OTA
# update is only offered to binaries whose native layer matches.
#
# `--platform ios` is REQUIRED: the app has native-only modules (live-activity Swift
# target + expo-audio voice) whose config plugin breaks the web bundle export, so
# letting eas-cli default to exporting every platform would fail the whole publish.
#
# Requires the `EXPO_TOKEN` repo secret (Expo access token) for authentication:
# https://docs.expo.dev/accounts/programmatic-access

on:
  push:
    branches:
      - main
    # Deliberately WIDER than the OTA-safe set (`mobile/src/**`, `mobile/assets/**`). A push that
    # changes only `mobile/app.config.ts` cannot ship an OTA — but it does mean a native build is
    # now owed, and with a narrow filter that push produced no run, no summary, and no warning at
    # all. The guard below still decides what actually publishes; the wider filter only guarantees
    # that "this change needs a native build" is *stated somewhere* instead of being silence.
    paths:
      - "mobile/**"
  # Manual recovery when an automatic publish did not run or failed (see RELEASING.md §6), and the
  # post-release hand-off from release.yml. The runtimeVersion fingerprint still gates delivery, so
  # a dispatch only reaches binaries whose native layer matches — never dispatch from a topic branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: eas update (production / ios)
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The guard validates the complete range from the installed archive's source commit,
          # not merely this push. This keeps a later source-only push from publishing native-
          # dependent JS after an earlier native change was correctly skipped.
          fetch-depth: 0

      - name: Require installed archive baseline
        env:
          BASELINE: ${{ vars.IOS_OTA_COMPATIBLE_BASE_SHA }}
        run: |
          set -euo pipefail
          if [ -z "$BASELINE" ]; then
            message="OTA refused: IOS_OTA_COMPATIBLE_BASE_SHA is unset. Build and install an Xcode archive, then set the variable to that archive's exact source commit."
            echo "::error title=OTA baseline missing::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### OTA baseline"
            echo "- installed archive source commit: \`$BASELINE\`"
            echo "- runtime fingerprint variable: \`${{ vars.IOS_OTA_RUNTIME_VERSION || 'unset' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard OTA-safe diff
        id: guard
        working-directory: .
        env:
          BASE_SHA: ${{ vars.IOS_OTA_COMPATIBLE_BASE_SHA }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/eas-ota-safety.sh

      # An incompatible bundle is not a successful publication. Fail this independent workflow so
      # the reconciler cannot mistake a green no-op for coverage; release.yml only dispatches this
      # workflow and does not make CLI/desktop artifacts depend on its conclusion.
      - name: Refuse incompatible OTA
        if: steps.guard.outputs.safe != 'true'
        env:
          BASELINE: ${{ vars.IOS_OTA_COMPATIBLE_BASE_SHA }}
          RUNTIME: ${{ vars.IOS_OTA_RUNTIME_VERSION }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          message="Refused OTA publication: ${BASELINE}..${HEAD_SHA} includes native, dependency, or build configuration changes. Installed runtime fingerprint is ${RUNTIME:-unset}. Build and install a new Xcode Cloud archive, then set IOS_OTA_COMPATIBLE_BASE_SHA to that archive's exact source commit and IOS_OTA_RUNTIME_VERSION to its embedded fingerprint."
          echo "::error title=OTA not published — native build required::$message"
          {
            echo "### OTA not published — native build required"
            echo "$message"
            echo
            echo "1. Build and install a new Xcode Cloud archive."
            echo "2. Set \`IOS_OTA_COMPATIBLE_BASE_SHA\` to the archive source commit."
            echo "3. Set \`IOS_OTA_RUNTIME_VERSION\` to the archive's embedded fingerprint."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: No OTA content to publish
        if: steps.guard.outputs.safe == 'true' && steps.guard.outputs.ota_changed != 'true'
        run: echo 'No OTA publication was needed because the push contains no mobile source or asset changes.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.safe == 'true' && steps.guard.outputs.ota_changed == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.safe == 'true' && steps.guard.outputs.ota_changed == 'true'
        run: npm ci

      - name: Require the installed archive runtime
        if: steps.guard.outputs.safe == 'true' && steps.guard.outputs.ota_changed == 'true'
        env:
          RUNTIME: ${{ vars.IOS_OTA_RUNTIME_VERSION }}
        run: test -n "$RUNTIME" || { echo 'Set the IOS_OTA_RUNTIME_VERSION repository variable from the installed Xcode archive fingerprint.'; exit 1; }

      - name: Publish EAS Update (production channel, iOS only)
        if: steps.guard.outputs.safe == 'true' && steps.guard.outputs.ota_changed == 'true'
        run: |
          # Isolate Metro's cache per run. These are persistent self-hosted runners where the
          # default os.tmpdir() cache (/tmp/metro-cache) is shared across runs and runner users;
          # `expo export --clear` then fails to rmdir a dir another user created (EACCES), which
          # silently left production on an older OTA. $RUNNER_TEMP is per-run and owned by this
          # job, so pointing TMPDIR there gives Metro a private, always-clearable cache.
          export TMPDIR="$RUNNER_TEMP/metro"
          mkdir -p "$TMPDIR"
          npx --yes eas-cli@20.5.1 update \
            --channel production \
            --environment production \
            --platform ios \
            --message "$(git log -1 --pretty='%h %s')" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          EXPO_RUNTIME_VERSION_OVERRIDE: ${{ vars.IOS_OTA_RUNTIME_VERSION }}
          # Cap Metro transform workers: unbounded fan-out on the memory-constrained
          # self-hosted runner exhausts RAM during bundling and freezes it (job lost
          # at ~600s, empty logs). Read by mobile/metro.config.js.
          METRO_MAX_WORKERS: "2"
      - name: Bound persistent dependency cache
        if: always()
        working-directory: .
        run: bash scripts/ci/trim-runner-cache.sh
