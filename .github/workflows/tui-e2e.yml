name: TUI and bridge E2E

# These tests spawn real Forge processes through a PTY or MCP transport. They are intentionally
# report-only while the runner behaviour is measured in the real queue; promote this workflow to a
# required check only after it has stayed green across several scheduled runs and merges.
on:
  workflow_dispatch:
  schedule:
    - cron: '31 5 * * 2' # Tuesday 05:31 UTC, away from the weekly full-suite flake hunt

permissions:
  contents: read

concurrency:
  group: tui-e2e
  cancel-in-progress: false

jobs:
  ignored-e2e:
    name: ignored CLI and TUI E2E
    # Do not use the heavy/release labels: these are short process-level tests and should use one
    # of the other self-hosted Linux runners rather than joining the workspace compile backlog.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      # Per-job store, same reason as ci.yml's test job: these runners are persistent, so an unset
      # FORGE_DB lets the tests that open the default store share one file across every branch, and
      # a branch carrying a new migration then breaks unrelated PRs built from an older main.
      - name: Run ignored CLI and TUI end-to-end tests
        run: cargo test --locked -p forge-agent --test tui_e2e --test mcp_serve_e2e -- --ignored
        env:
          FORGE_DB: ${{ runner.temp }}/forge-ci-tui-e2e.db


  # Opens one tracking issue when this workflow goes red and closes it when it is green again, so a
  # scheduled or release failure is not silent. Hosted runner on purpose: it must still report when
  # the self-hosted runners are the thing that is down. Main-only, never PR CI; `cancelled` and
  # `skipped` legs are neutral (see scripts/ci/report-workflow-status.sh).
  report:
    name: report status to tracking issue
    needs: [ignored-e2e]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/ci
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: bash scripts/ci/report-workflow-status.sh
