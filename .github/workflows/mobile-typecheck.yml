name: mobile-typecheck

# Classifies every PR, then runs only the affected app and/or Tauri checks. Keeping the workflow
# present on every PR gives branch protection a stable aggregate check even for intentional skips.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  # Branch-keyed so a dispatched run and a pull_request run for the same branch share one group.
  # See the note in ci.yml for the measurement behind this.
  group: mobile-typecheck-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "4"

jobs:
  changes:
    name: detect affected jobs
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      mobile_app: ${{ steps.classify.outputs.mobile_app }}
      mobile_tauri: ${{ steps.classify.outputs.mobile_tauri }}
      mobile_deps: ${{ steps.deps.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/changed-groups.sh
      # Whether this PR touches the app's dependency manifests — the only PRs for which expo-doctor's
      # SDK version comparison is something the author can act on (see the Check app step).
      - id: deps
        name: Detect dependency manifest changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            changed=true
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- mobile/package.json mobile/package-lock.json; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  app:
    name: lint, typecheck, and tests
    needs: changes
    if: needs.changes.outputs.mobile_app == 'true'
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check declared mobile/desktop parity
        working-directory: .
        run: python3 scripts/check-mobile-parity.py
      - name: Test parity guard rejects drift
        working-directory: .
        run: python3 scripts/test-mobile-parity.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Audit shipped npm dependencies
        run: bash ../scripts/ci/npm-audit-gate.sh
      - name: Test npm audit gate blocks and waives correctly
        working-directory: .
        run: bash scripts/ci/test-npm-audit-gate.sh

      # expo-doctor's SDK version comparison reads Expo's *current* patch versions over the network,
      # so an Expo publish turns every open PR red with nothing changed in it. It stays enforcing on
      # a PR that edits the dependency manifests — the one place the drift is fixable — and is a
      # warning everywhere else. Bumping the packages from an unrelated PR is not free: any change to
      # mobile/package.json locks iOS OTA delivery until the next native build
      # (scripts/ci/eas-ota-safety.sh). The release path skips the comparison outright
      # (scripts/ci/mobile-release-check.sh).
      - name: Check app
        env:
          DEPS_CHANGED: ${{ needs.changes.outputs.mobile_deps }}
        run: |
          if [ "$DEPS_CHANGED" = "true" ]; then
            npm run check
          else
            npx expo install --check \
              || echo "::warning title=Expo SDK patch drift::installed Expo packages are behind the SDK's current patch versions; bump them in a PR that also plans a native build"
            EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK=1 npm run check
          fi
      - name: Export web app
        run: npx --no-install expo export -p web
        env:
          # Metro defaults to roughly one transform worker per CPU. On the
          # memory-bounded self-hosted runners that exceeds the service cgroup
          # before the export can finish, so use the same proven cap as OTA.
          METRO_MAX_WORKERS: "2"
      # Roughly 400 ms of a measured 995 ms cold start to first paint is bundle
      # fetch, parse, and evaluation, and nothing else here notices if that grows.
      # Reads the export above rather than producing one, so it costs no build time.
      - name: Check bundle size budget
        working-directory: .
        run: python3 scripts/ci/bundle_size.py

      - name: Bound persistent dependency cache
        if: always()
        working-directory: .
        run: bash scripts/ci/trim-runner-cache.sh

  tauri:
    name: Tauri tests, clippy, and audit
    needs: changes
    if: needs.changes.outputs.mobile_tauri == 'true'
    runs-on: [self-hosted, linux, x64, heavy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy
      - name: Ensure cargo-audit is installed
        run: |
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          cargo audit --version 2>/dev/null | grep -q '0.22.2' || cargo install --locked cargo-audit --version 0.22.2
      # Per-job store: these runners are persistent, so an unset FORGE_DB shares one file across
      # branches and a migration on any of them breaks every other PR. See ci.yml's test job.
      - run: cargo test --locked --manifest-path mobile/src-tauri/Cargo.toml
        env:
          FORGE_DB: ${{ runner.temp }}/forge-ci-tauri.db
      - run: cargo clippy --locked --manifest-path mobile/src-tauri/Cargo.toml --all-targets -- -D warnings
      # Tauri's current Linux webview stack still pins gtk-rs/glib 0.18. RUSTSEC-2024-0429
      # concerns VariantStrIter, which Forge never calls; keep every other vulnerability blocking
      # while upstream completes its GTK dependency migration. Unmaintained GTK3 warnings remain
      # visible without failing because Tauri/Wry still require that stack on Linux.
      - run: cargo audit --file mobile/src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429
      - name: Bound persistent build cache
        if: always()
        run: bash scripts/ci/trim-runner-cache.sh

  mobile-typecheck:
    name: mobile checks
    needs: [changes, app, tauri]
    if: always()
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Check affected jobs passed
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.app.result }}" \
            "${{ needs.tauri.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "An affected mobile job failed or was cancelled"; exit 1 ;;
            esac
          done
          echo "All affected mobile jobs passed"
